<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON PARADOX | ELITE EDITION</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="crt-master">

    <div id="splash-screen" class="overlay active">
        <h1 class="glitch-title" data-text="NEON PARADOX">NEON PARADOX</h1>
        <p class="dev-signature">ARCHITECT: SRIPARNO MALIK</p>
        <button class="nav-btn blue" onclick="System.initTerminal()">[ INITIALIZE NEURAL LINK ]</button>
    </div>

    <div id="loading-screen" class="overlay">
        <div class="loading-container">
            <div id="loading-text">UPDATING_CITY_SHADERS...</div>
            <div class="progress-bg"><div id="progress-bar"></div></div>
        </div>
    </div>

    <div id="settings-room" class="room">
        <header><h1 class="blue">SYSTEM_SETTINGS</h1></header>
        <div class="settings-grid">
            <div class="setting-item">
                <label>REALITY_SPLIT_DELAY</label>
                <input type="range" id="set-split-timer" min="15" max="60" value="30" onchange="System.updateSettings()">
                <span id="split-timer-val">30s</span>
            </div>
            <div class="setting-item">
                <label>AUDIO_CONFIG</label>
                <button class="nav-btn pink" id="mute-btn" onclick="System.toggleMute()">MUTE: OFF</button>
            </div>
            <div class="setting-item">
                <label>SELECT_SKIN</label>
                <div class="skin-selector">
                    <div class="skin-opt active" style="--c: #00f0ff" onclick="System.setSkin('#00f0ff', this)"></div>
                    <div class="skin-opt" style="--c: #ff003c" onclick="System.setSkin('#ff003c', this)"></div>
                    <div class="skin-opt" style="--c: #39ff14" onclick="System.setSkin('#39ff14', this)"></div>
                    <div class="skin-opt" style="--c: #ffd700" onclick="System.setSkin('#ffd700', this)"></div>
                </div>
            </div>
        </div>
        <button class="nav-btn blue" onclick="System.switchRoom('hub-room')">[ SAVE_&_RETURN ]</button>
    </div>

    <div id="hub-room" class="room">
        <header>
            <h1 class="glitch-title">NEON PARADOX</h1>
            <p class="dev-credit">SRIPARNO MALIK // ELITE_CORE_V19.5</p>
        </header>
        <main class="hub-grid">
            <div class="col previews">
                <div class="monitor blue"><div class="tag">ALPHA_FEED</div><canvas id="prevAlpha"></canvas></div>
                <div class="monitor orange"><div class="tag">OMEGA_FEED</div><canvas id="prevOmega"></canvas></div>
            </div>
            <div class="col menu-col">
                <button class="nav-btn blue" onclick="System.loadWithBar('VOID')">[ START RUN ]</button>
                <button class="nav-btn pink" onclick="System.switchRoom('settings-room')">[ SETTINGS ]</button>
                <button class="nav-btn orange" onclick="System.loadScores()">[ RANKINGS ]</button>
            </div>
            <div class="col">
                <div class="board-panel"><div class="tag">GLOBAL_LOGS</div><div id="score-list"></div></div>
            </div>
        </main>
    </div>

    <div id="void-room" class="room">
        <div id="game-hud">
            <div class="hud-item">DATA: <span id="sync-val">0</span></div>
            <div class="hud-item" id="overdrive-status" style="color:var(--gold); display:none; font-size:1rem;">PHANTOM_STRIKE: ACTIVE</div>
            <div class="hud-item"><div id="phase-cooldown-bar"></div><span id="phase-status">READY</span></div>
        </div>
        <div id="canvas-stack">
            <canvas id="canvasA"></canvas>
            <canvas id="canvasO"></canvas>
        </div>
    </div>

    <div id="death-overlay" class="overlay">
        <div class="death-box">
            <h1 class="red-glitch">NEURAL_DEATH</h1>
            <p>SCORE: <span id="final-score">0</span></p>
            <input type="text" id="runner-name" placeholder="IDENT_ID" maxlength="10">
            <button class="nav-btn pink" onclick="System.submit()">UPLOAD</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
