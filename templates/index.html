<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON PARADOX | SRIPARNO MALIK</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="crt-master">

    <!-- SPLASH -->
    <div id="splash-screen" class="overlay active">
        <div class="ui-panel">
            <h1 class="glitch-title" data-text="NEON PARADOX">NEON PARADOX</h1>
            <p class="dev-signature">ARCHITECT: SRIPARNO MALIK</p>
            <button class="nav-btn blue pulse" onclick="System.initTerminal()">[ INITIALIZE NEURAL LINK ]</button>
        </div>
    </div>

    <!-- BSOD -->
    <div id="blue-screen" class="overlay bsod">
        <div class="bsod-content">
            <h1>:(</h1>
            <p>CRITICAL_PROCESS_DIED: DATA_CORRUPTION</p>
            <p id="bsod-timer">REBOOTING IN 3s...</p>
        </div>
    </div>

    <!-- HUB (Scrollable) -->
    <div id="hub-room" class="room">
        <header class="hub-header">
            <h1 class="glitch-title small">NEON PARADOX</h1>
            <p class="dev-credit">SRIPARNO MALIK // V23.0</p>
        </header>

        <main class="hub-grid">
            <div class="col previews">
                <div class="monitor blue"><div class="mon-header">ALPHA_PILOT</div><canvas id="prevAlpha"></canvas></div>
                <div class="monitor orange"><div class="mon-header">OMEGA_PILOT</div><canvas id="prevOmega"></canvas></div>
            </div>

            <div class="col menu-col">
                <button class="nav-btn blue" onclick="System.loadWithBar('VOID')">START RUN</button>
                <button class="nav-btn pink" onclick="System.switchRoom('settings-room')">SETTINGS</button>
                <button class="nav-btn orange" onclick="System.switchRoom('manual-room')">MANUAL</button>
            </div>

            <div class="col leaderboard-col">
                <div class="glass-panel">
                    <h2 class="panel-tag">GLOBAL_LOGS</h2>
                    <div id="score-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- SETTINGS -->
    <div id="settings-room" class="room">
        <div class="glass-panel wide">
            <h1>CORE_CONFIG</h1>
            <div class="settings-list">
                <div class="s-row">
                    <label>REALITY_SPLIT (SEC)</label>
                    <input type="range" id="split-slider" min="10" max="60" value="30" oninput="System.updateSettings()">
                    <span id="split-val">30s</span>
                </div>
                <div class="s-row">
                    <label>NEURAL_SKIN</label>
                    <div class="skin-selector">
                        <div class="skin-opt active" style="--c: #00f0ff" onclick="System.setSkin('#00f0ff', this)"></div>
                        <div class="skin-opt" style="--c: #ff003c" onclick="System.setSkin('#ff003c', this)"></div>
                        <div class="skin-opt" style="--c: #39ff14" onclick="System.setSkin('#39ff14', this)"></div>
                        <div class="skin-opt" style="--c: #ffd700" onclick="System.setSkin('#ffd700', this)"></div>
                    </div>
                </div>
                <button class="nav-btn blue" onclick="System.switchRoom('hub-room')">SAVE & EXIT</button>
            </div>
        </div>
    </div>

    <!-- VOID (GAMEPLAY) -->
    <div id="void-room" class="room">
        <div id="glitch-code-container"></div>
        <div id="game-hud">
            <div class="hud-box">DATA: <span id="sync-val">0</span></div>
            <div class="hud-box" id="glitch-status" style="display:none; color:var(--gold)">DECRYPT: <span id="glitch-pct">0</span>%</div>
            <div class="hud-box"><div id="phase-cooldown-bar"></div><span id="phase-status">READY</span></div>
        </div>
        <div id="canvas-stack">
            <canvas id="canvasA"></canvas>
            <canvas id="canvasO"></canvas>
        </div>
    </div>

    <!-- DEATH -->
    <div id="death-overlay" class="overlay">
        <div class="glass-panel death-box">
            <h1 class="red-glitch">NEURAL_DEATH</h1>
            <p>SCORE: <span id="final-score">0</span></p>
            <input type="text" id="runner-name" placeholder="INIT_ID" maxlength="10">
            <button class="nav-btn pink" onclick="System.submit()">UPLOAD</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
