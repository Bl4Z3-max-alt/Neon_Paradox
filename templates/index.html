<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON PARADOX: MASTER EDITION</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body class="crt-master">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="overlay active">
        <h1 class="glitch-title" data-text="NEON PARADOX">NEON PARADOX</h1>
        <p class="dev-signature">DEVELOPED BY: SRIPARNO MALIK</p>
        <p class="sys-info">SYSTEM_v15.0 // MOBILE_READY // ENCRYPTED</p>
        <button class="nav-btn blue" onclick="System.initTerminal()">[ CONNECT TO MAINFRAME ]</button>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-screen" class="overlay">
        <div class="loading-container">
            <div id="loading-text">RECALIBRATING_REALITY...</div>
            <div class="progress-bg"><div id="progress-bar"></div></div>
        </div>
    </div>

    <!-- ROOM 1: THE HUB -->
    <div id="hub-room" class="room">
        <header>
            <h1 class="glitch-title" data-text="NEON PARADOX">NEON PARADOX</h1>
            <div class="sys-info">ARCHITECT: SRIPARNO MALIK // STATUS: ONLINE</div>
        </header>

        <main class="hub-grid">
            <div class="col previews">
                <div class="monitor blue">
                    <div class="tag">FEED: ALPHA</div>
                    <canvas id="prevAlpha"></canvas>
                </div>
                <div class="monitor orange">
                    <div class="tag">FEED: OMEGA</div>
                    <canvas id="prevOmega"></canvas>
                </div>
            </div>

            <div class="col menu-col">
                <button class="nav-btn blue" onclick="System.loadWithBar('VOID')">[START RUN]</button>
                <button class="nav-btn pink" onclick="System.loadWithBar('RANKINGS')">[RANKINGS]</button>
                <button class="nav-btn orange" onclick="System.showManual()">[MANUAL]</button>
            </div>

            <div class="col">
                <div class="board-panel">
                    <div class="tag">TOP_OPERATORS</div>
                    <div id="score-list"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ROOM 2: THE VOID -->
    <div id="void-room" class="room">
        <div id="game-hud">
            <div class="hud-item">DATA: <span id="sync-val">0</span></div>
            <div class="hud-item">
                <div id="phase-cooldown-wrapper"><div id="phase-cooldown-bar"></div></div>
                <span id="phase-status">READY</span>
            </div>
        </div>
        
        <div id="canvas-stack">
            <canvas id="canvasA"></canvas>
            <canvas id="canvasO"></canvas>
        </div>
        
        <div id="mobile-hint">L_TAP: FLIP | R_TAP: JUMP | C_TAP: PHASE</div>
    </div>

    <!-- ROOM 3: DEATH SCREEN -->
    <div id="death-overlay" class="overlay">
        <div class="death-box">
            <h1 class="red-glitch">CONNECTION_LOST</h1>
            <p>DATA_RECOVERED: <span id="final-score">0</span></p>
            <input type="text" id="runner-name" placeholder="INIT_RUNNER_ID" maxlength="10">
            <button class="nav-btn pink" onclick="System.submit()">UPLOAD_DATA</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
